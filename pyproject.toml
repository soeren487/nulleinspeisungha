[project]
name = "nulleinspeisung"
version = "0.3.1"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component>=0.13.316",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "measured_inverters: simulated Inverters ramp their limit as measured",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF", "PT", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
